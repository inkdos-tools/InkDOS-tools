name: Build and deploy tools

# Builds every tool and publishes the result to the gh-pages branch, which GitHub Pages serves
# (Settings → Pages → Source: "Deploy from a branch", branch gh-pages, folder / ).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rust toolchain for pnk (wasm32 target, wasm-bindgen 0.2.127)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Build every tool
        run: python build.py --out _site
      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true  # one commit per deploy, so old builds do not pile up in history
          commit_message: Deploy tools site
