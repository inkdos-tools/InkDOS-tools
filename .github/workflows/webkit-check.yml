name: WebKit check (published site)

# Manual diagnostics: opens the published site in WebKit (Safari's engine) with an iPad profile and reports
# console errors, failed requests and navigation (scripts/webkit_check.py). It publishes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Playwright with WebKit
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps webkit
      - name: Check the published site
        run: python scripts/webkit_check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: webkit-report
          path: webkit-report/
