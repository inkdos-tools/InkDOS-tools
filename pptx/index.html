<title>PowerPoint viewer</title>

<body>
<header class="viewer-bar">
  <strong>PowerPoint viewer</strong>
  <span class="viewer-name" id="fileName"></span>
  <label class="viewer-open">Open .pptx<input id="picker" type="file" accept=".pptx,.pptm,.ppsx,.potx,application/vnd.openxmlformats-officedocument.presentationml.presentation"></label>
</header>
<main class="viewer-stage" id="stage">
  <p class="viewer-status" id="status">View only, with the layout of the PowerPoint file. Choose a .pptx file; it never leaves this device.</p>
  <div id="slides" class="pptx-host" hidden></div>
</main>
<script src="viewer.js"></script>
<script src="../viewers/viewer-embed.js"></script>
