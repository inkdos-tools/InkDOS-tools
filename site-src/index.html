<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>InkDOS advanced tools</title>
  <style>
    :root{--bg:#f2f5f8;--card:#fff;--text:#192235;--muted:#697486;--border:#e3e8ef}
    @media (prefers-color-scheme:dark){:root{--bg:#11161c;--card:#1c222a;--text:#edf2f7;--muted:#aab5c3;--border:#323c49}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(760px,100% - 32px);margin:0 auto;padding:40px 0}h1{font-size:28px;margin:0 0 6px}p{color:var(--muted);margin:0 0 22px}
    ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}a{color:inherit;text-decoration:none}
    li a{display:flex;flex-direction:column;gap:3px;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
    li a:hover{border-color:var(--muted)}small{color:var(--muted)}em{font-style:normal;font-size:12px;color:var(--muted)}
    footer{margin-top:28px;font-size:12px;color:var(--muted)}footer a{text-decoration:underline}
  </style>
</head>
<body>
  <main>
    <h1>InkDOS advanced tools</h1>
    <p>Open-source tools that run entirely in your browser. Files are processed on your device and never uploaded.</p>
    <ul>
<!-- TOOLS -->
    </ul>
    <footer>Each tool keeps its own licence (see <code>UPSTREAM-LICENSE.txt</code> in its folder). <a href="https://vfydr2m9wk-ops.github.io/InkDOS/">Back to InkDOS</a> · <a href="https://github.com/vfydr2m9wk-ops/inkdos-tools">Source</a></footer>
  </main>
</body>
</html>
