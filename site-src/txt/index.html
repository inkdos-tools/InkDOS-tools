<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Plain Text</title>
  <link rel="stylesheet" href="./cm/lib/codemirror.css">
  <link rel="stylesheet" href="./cm/addon/dialog/dialog.css">
  <link rel="stylesheet" href="./txt.css">
</head>
<body>
  <header id="bar">
    <button type="button" data-new>New</button>
    <button type="button" data-open>Open…</button>
    <button type="button" data-save>Save</button>
    <button type="button" data-find>Find</button>
    <label><input type="checkbox" data-wrap checked> Wrap</label>
    <span id="name">untitled.txt</span>
    <input type="file" id="file-input" hidden accept=".txt,.md,.markdown,.log,.ini,.cfg,.conf,.toml,.properties,.xml,.json,.jsonl,.ndjson,.yaml,.yml,.csv,.tsv,.js,.css,.html,.py,.sh,text/*">
  </header>
  <main id="editor"></main>
  <script src="./cm/lib/codemirror.js"></script>
  <script src="./cm/addon/dialog/dialog.js"></script>
  <script src="./cm/addon/search/searchcursor.js"></script>
  <script src="./cm/addon/search/search.js"></script>
  <script src="./cm/addon/edit/matchbrackets.js"></script>
  <script src="./cm/mode/markdown/markdown.js"></script>
  <script src="./cm/mode/javascript/javascript.js"></script>
  <script src="./cm/mode/xml/xml.js"></script>
  <script src="./cm/mode/yaml/yaml.js"></script>
  <script src="./cm/mode/css/css.js"></script>
  <script src="./cm/mode/python/python.js"></script>
  <script src="./cm/mode/shell/shell.js"></script>
  <script src="./cm/mode/properties/properties.js"></script>
  <script src="./cm/mode/toml/toml.js"></script>
  <script src="./txt.js"></script>
</body>
</html>
