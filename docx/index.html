<!doctype html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'self' blob: https://vfydr2m9wk-ops.github.io; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'" data-inkdos-tools>
<meta charset="utf-8">

<title>Word document viewer</title>
<link rel="stylesheet" href="../viewers/viewer.css">
<link rel="stylesheet" href="viewer.css">
<script src="../viewers/viewer-theme.js"></script>

<body>
<header class="viewer-bar">
  <strong>Word document viewer</strong>
  <span class="viewer-name" id="fileName"></span>
  <label class="viewer-open">Open .docx<input id="picker" type="file" accept=".docx,.docm,.dotx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></label>
</header>
<main class="viewer-stage" id="stage">
  <p class="viewer-status" id="status">View only, with the layout of the Word file. Choose a .docx file; it never leaves this device.</p>
  <div id="doc" class="docx-host" hidden></div>
</main>
<script src="viewer.js"></script>
<script src="../viewers/viewer-embed.js"></script>
</body>
